name: Build and Rollout Extensions Reusable
on:
  workflow_call:
    inputs:
      branch:
        description: Repository branch to build.
        type: string
        default: master
    secrets:
      GH_ACCESS_TOKEN:
        required: true

jobs:
  build-and-release:
    name: Build and Rollout Extensions
    outputs:
      meshery_version: ${{ steps.set-vars.outputs.MESHERY_VERSION }}
      meshery_extension_version: ${{ steps.set-vars.outputs.MESHERY_EXTENSION_VERSION }}
    env:
      RELEASE_CHANNEL: "kanvas"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout meshery/meshery
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: "meshery"
          repository: meshery/meshery
          ref: ${{ inputs.branch }}
          sparse-checkout: |
             ui
             provider-ui
             server
             install/docker/**
             install/*
             /*
          sparse-checkout-cone-mode: false

      # - name: Checkout kanvas
      #   uses: actions/checkout@v7
      #   with:
      #     fetch-depth: 1
      #     sparse-checkout: |
      #       kanvas
      #     path: "kanvas"
      #     sparse-checkout-cone-mode: false

      - name: Fetch version scripts from meshery-extensions.
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          path: "meshery-extensions"
          fetch-depth: 1
          sparse-checkout: |
            kanvas
            build/get-meshery-version
            build/get-extension-version
          sparse-checkout-cone-mode: false

      - name: File system view
        run: |
          pwd;
          ls;
          tree  meshery-extensions;

      - name: Fetch Meshery and Extensions version
        id: set-vars
        run: |
          chmod +x ./meshery-extensions/build/get-meshery-version
          MESHERY_VERSION=$(./meshery-extensions/build/get-meshery-version)
          echo "MESHERY_VERSION=$MESHERY_VERSION" >> $GITHUB_ENV
          echo "MESHERY_VERSION=$MESHERY_VERSION" >> $GITHUB_OUTPUT

          chmod +x ./meshery-extensions/build/get-extension-version
          MESHERY_EXTENSION_VERSION=$(./meshery-extensions/build/get-extension-version)
          echo "MESHERY_EXTENSION_VERSION=$MESHERY_EXTENSION_VERSION" >> $GITHUB_ENV
          echo "MESHERY_EXTENSION_VERSION=$MESHERY_EXTENSION_VERSION" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: azure/docker-login@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure kanvas distro
        # merges the custom kanvas distro at currentrepo/kanvas with the meshery repo checked out to
        # meshery/meshery directory to create a new meshery distro
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          echo "=== Before merge ==="
          ls -A
          echo
          echo "Contents of meshery/"
          ls -A meshery || echo "(empty or does not exist yet)"
          echo
          echo "Contents of ./meshery-extensions/kanvas/"
          ls -A ./meshery-extensions/kanvas
          
          echo
          echo "=== Merging everything from kanvas/ into meshery/ (including hidden files) ==="
          # This copies ALL files and directories, including hidden ones (.meshery, .git, etc.)
          cp -a ./meshery-extensions/kanvas/. ./meshery/
          
          echo
          echo "=== Updating capabilities.json with extension version ==="
          sed -i "s/REPLACE_WITH_PACKAGE_VERSION/${MESHERY_EXTENSION_VERSION:-unknown}/g" ./meshery/.meshery/provider/Layer5/capabilities.json
          
          echo
          echo "capabilities.json after substitution:"
          cat ./meshery/.meshery/provider/Layer5/capabilities.json
          
          echo
          echo "=== After merge ==="
          echo "Top-level in meshery/"
          ls -A meshery
          echo
          echo "Hidden .meshery directory contents:"
          ls -A meshery/.meshery
          echo
          echo "UI directory (example of deep path):"
          ls -A meshery/ui || echo "(not present)"

      - name: Docker build & tag
        working-directory: "./meshery"
        run: |
          # The server stage downloads every Go module from proxy.golang.org with a
          # cleaned module cache, so one transient proxy error fails the whole build
          # (this is what left v1.0.72-1 without an image). Retry the build a few times.
          for attempt in 1 2 3; do
            if DOCKER_BUILDKIT=1 docker build -f install/docker/Dockerfile --no-cache -t layer5/kanvas:latest --build-arg TOKEN=${{ secrets.GLOBAL_TOKEN }} --build-arg GIT_COMMITSHA=${GITHUB_SHA::8} --build-arg GIT_VERSION=${{ env.MESHERY_EXTENSION_VERSION }} --build-arg RELEASE_CHANNEL=${RELEASE_CHANNEL} .; then
              exit 0
            fi
            echo "::warning::docker build attempt $attempt failed"
            sleep $((attempt * 30))
          done
          echo "::error::docker build failed after 3 attempts"
          exit 1

      - name: Bundle kanvas extension with the image
        working-directory: "./meshery-extensions"
        run: |
          wget https://github.com/meshery-extensions/meshery-extensions-packages/releases/download/${{ env.MESHERY_EXTENSION_VERSION }}/provider-meshery.tar.gz

          mkdir extensions-package
          tar xzf provider-meshery.tar.gz -C extensions-package
          mkdir -p provider/Layer5/${{ env.MESHERY_EXTENSION_VERSION }}
          mv extensions-package/provider provider/Layer5/${{ env.MESHERY_EXTENSION_VERSION }}

          ls;

          docker run -d --name meshery-tmp layer5/kanvas:latest

          docker cp -a ./provider/ meshery-tmp:/home/appuser/.meshery/

          docker container commit meshery-tmp layer5/kanvas:latest

          # Nothing references meshery-tmp past this point; the commit above is what we publish.
          # Harmless on hosted runners (fresh VM per job), but prevents a name collision on rerun
          # if this job is ever moved to a self-hosted or otherwise reused runner.
          docker rm -f meshery-tmp
      # Fails the release before anything is pushed or rolled out if the bundled
      # GraphQL plugin cannot be loaded by this image's server. plugin.Open requires
      # the plugin and the server to share the exact Go toolchain; a mismatch aborts
      # the server ("fatal error: runtime: no plugin module data") on the first
      # extension load, which is what crash-looped kanvas.new on v1.0.71-1.
      - name: Smoke test the Kanvas image
        run: |
          set -euo pipefail
          IMAGE=layer5/kanvas:latest
          PROVIDER_DIR=/home/appuser/.meshery/provider/Layer5
          PLUGIN=$PROVIDER_DIR/${MESHERY_EXTENSION_VERSION}/provider/navigator/meshmap/graphql/plugin.so
          GO_IMAGE=$(sed -n 's/^FROM \(golang:[0-9][0-9.]*\) AS meshery-server.*/\1/p' meshery/install/docker/Dockerfile)
          test -n "$GO_IMAGE"
          mkdir -p smoke

          echo "== Toolchains: server binary vs GraphQL plugin"
          docker create --name kanvas-smoke-files "$IMAGE" >/dev/null
          docker cp kanvas-smoke-files:/app/server/cmd/meshery smoke/meshery
          docker cp kanvas-smoke-files:"$PLUGIN" smoke/plugin.so
          docker rm kanvas-smoke-files >/dev/null
          SERVER_GO=$(docker run --rm -v "$PWD/smoke:/smoke" "$GO_IMAGE" go version /smoke/meshery | awk '{print $2}')
          PLUGIN_GO=$(docker run --rm -v "$PWD/smoke:/smoke" "$GO_IMAGE" go version /smoke/plugin.so | awk '{print $2}')
          echo "server=$SERVER_GO plugin=$PLUGIN_GO"
          if [ "$SERVER_GO" != "$PLUGIN_GO" ]; then
            echo "::error::GraphQL plugin was built with $PLUGIN_GO but the server with $SERVER_GO; plugin.Open would abort the server"
            exit 1
          fi

          echo "== plugin.Open by a loader compiled exactly like the server"
          # The loader links the server's handlers package and is compiled in the
          # server's build image, at the server's source path and with its build tags,
          # so plugin.Open compares the same package hashes the real server would.
          SERVER_SRC=$(sed -n '/AS meshery-server/,/^FROM /s/^WORKDIR //p' meshery/install/docker/Dockerfile)
          SERVER_TAGS=$(sed -n '/AS meshery-server/,/^FROM /s/.* -tags \([^ ]*\) .*/\1/p' meshery/install/docker/Dockerfile | head -1)
          test -n "$SERVER_SRC"
          mkdir -p meshery/server/cmd/plugincheck
          cat > meshery/server/cmd/plugincheck/main.go <<'GO'
          package main

          import (
          	"fmt"
          	"os"
          	"plugin"

          	_ "github.com/meshery/meshery/server/handlers"
          )

          func main() {
          	p, err := plugin.Open(os.Args[1])
          	if err == nil {
          		_, err = p.Lookup("Run")
          	}
          	if err != nil {
          		fmt.Println("plugin load failed:", err)
          		os.Exit(1)
          	}
          	fmt.Println("plugin.Open ok")
          }
          GO
          docker run --rm -v "$PWD/meshery:$SERVER_SRC" -v "$PWD/smoke:/smoke" -w "$SERVER_SRC/server/cmd/plugincheck" "$GO_IMAGE" \
            go build ${SERVER_TAGS:+-tags $SERVER_TAGS} -o /smoke/plugincheck .
          docker run --rm -v "$PWD/smoke:/smoke" --entrypoint /smoke/plugincheck "$IMAGE" "$PLUGIN"

          echo "== Server stays up across an anonymous page load and an extension load"
          docker run -d --name kanvas-smoke -p 9081:8080 \
            -e PROVIDER=Layer5 -e PLAYGROUND=true -e DISABLE_OPERATOR=true \
            -e SKIP_DOWNLOAD_EXTENSIONS=true \
            -e PROVIDER_CAPABILITIES_FILEPATH=$PROVIDER_DIR/capabilities.json \
            "$IMAGE" >/dev/null
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:9081/ && break
            sleep 2
          done
          curl -s -o /dev/null -w "/extension/meshmap -> %{http_code}\n" http://localhost:9081/extension/meshmap
          curl -s -o /dev/null -w "/api/provider/extension/ -> %{http_code}\n" http://localhost:9081/api/provider/extension/
          sleep 15
          RUNNING=$(docker inspect -f '{{.State.Running}}' kanvas-smoke)
          docker logs kanvas-smoke 2>&1 | grep -E "fatal error|panic:" && RUNNING=false || true
          docker rm -f kanvas-smoke >/dev/null
          if [ "$RUNNING" != "true" ]; then
            echo "::error::Meshery server in the Kanvas image did not stay up"
            exit 1
          fi
          echo "Kanvas image smoke test passed"

      - name: Clean up checkout out repos
        run: |
          rm -rf ./meshery 
          rm -rf ./meshery-extensions
          
      # Kanvas publishes to Docker Hub `layer5/kanvas` (NOT `layer5/meshery`, and NOT
      # `layer5/meshery-cloud`, which is a different product). Tags: latest, <short-sha>,
      # <meshery-version>, <extension-version> - no `kanvas-` prefix; the repository name
      # already carries that meaning.
      #
      # These tags are consumed outside this repo. Anything changing them must be coordinated with:
      #   - layer5labs/meshery-extensions  deploy/{prod,staging}/kanvas.yaml
      #   - layer5io/meshery-cloud         deploy/{prod,staging}/kanvas/kanvas.new-deployment-svc.yaml
      #   - layer5io/kanvas-docker-extension  docker-compose.yaml, and the `sed` that rewrites its
      #     image tag in .github/workflows/{build-and-release,multi-platform}.yml
      # The first two sets both describe Deployment/kanvas in namespace meshery-extensions - the same
      # object the "Rollout Kanvas" step below mutates - so a re-apply of a stale copy silently
      # reverts the image.
      #
      # The canonical `layer5/kanvas` tags are pushed FIRST. If that fails, the legacy push and the
      # rollout below are both skipped (`bash -e` + no `continue-on-error`), so a broken release
      # cannot leave the two repositories publishing different images.
      - name: Docker tag & push
        run: |
          # `layer5/kanvas` is a distinct Docker Hub repository from `layer5/meshery`, and Hub push
          # rights are granted per repository. A `denied: requested access to the resource is denied`
          # below means the CI credential lacks push access to layer5/kanvas - not a transient fault.
          echo "Publishing to layer5/kanvas (mirroring legacy layer5/meshery:kanvas-* - see issue #744)"

          docker tag layer5/kanvas:latest "layer5/kanvas:${GITHUB_SHA::8}"
          docker tag layer5/kanvas:latest layer5/kanvas:${{ env.MESHERY_VERSION }}
          docker tag layer5/kanvas:latest layer5/kanvas:${{ env.MESHERY_EXTENSION_VERSION }}

          docker push layer5/kanvas:latest
          docker push "layer5/kanvas:${GITHUB_SHA::8}"
          docker push layer5/kanvas:${{ env.MESHERY_VERSION }}
          docker push layer5/kanvas:${{ env.MESHERY_EXTENSION_VERSION }}

          # --- TRANSITIONAL: legacy layer5/meshery:kanvas-* mirror -------------------------------
          # Tracked for removal in issue #744. Remove this block - not before - once all 7 known
          # references listed there resolve `layer5/kanvas`.
          #
          # This is a mirror, not a fallback. Without it a clean cut does NOT fail loudly: the old
          # `kanvas-latest` tag still exists, so unmigrated consumers keep pulling it successfully
          # and silently freeze on a stale image. Nothing goes red. Mirroring keeps them current
          # until each has moved.
          #
          # All four tags are mirrored, not just `latest`: layer5io/kanvas-docker-extension pins
          # the extension-version tag via `sed`, so mirroring `latest` alone would not cover it.
          docker tag layer5/kanvas:latest layer5/meshery:kanvas-latest
          docker tag layer5/kanvas:latest "layer5/meshery:kanvas-${GITHUB_SHA::8}"
          docker tag layer5/kanvas:latest layer5/meshery:kanvas-${{ env.MESHERY_VERSION }}
          docker tag layer5/kanvas:latest layer5/meshery:kanvas-${{ env.MESHERY_EXTENSION_VERSION }}

          docker push layer5/meshery:kanvas-latest
          docker push "layer5/meshery:kanvas-${GITHUB_SHA::8}"
          docker push layer5/meshery:kanvas-${{ env.MESHERY_VERSION }}
          docker push layer5/meshery:kanvas-${{ env.MESHERY_EXTENSION_VERSION }}
          # --- end TRANSITIONAL (issue #744) -----------------------------------------------------

      - name: Rollout Kanvas
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_BASTION_HOST }}
          username: ${{ secrets.OCI_BASTION_USERNAME }}
          key: ${{ secrets.OCI_BASTION_KEY }}
          port: 22
          # Redundant with `set -eu` below. Kept as a second layer, but the script does not depend
          # on it: without it, only the LAST command's exit status is reported, so a failure of
          # `use-context` would be masked by a later command succeeding - and the image would be
          # set against whatever context happened to be current.
          script_stop: true
          script: |
            # Failure semantics belong in the script, not in the action. Relying on the action to
            # propagate a failure is the same shape as the bug this step exists to fix.
            # `pipefail` is deliberately omitted: there are no pipes here, and it is not POSIX, so
            # it would fail outright under a dash/sh login shell - turning a safety measure into a
            # release blocker.
            set -eu

            NAMESPACE=meshery-extensions
            DEPLOYMENT=kanvas
            # Equal to DEPLOYMENT by coincidence, not by rule - this is the container name inside
            # the pod spec. Kept separate so renaming one cannot silently move the other.
            CONTAINER=kanvas

            kubectl config use-context prod
            kubectl set image "deployment/$DEPLOYMENT" "$CONTAINER=layer5/kanvas:${{env.MESHERY_EXTENSION_VERSION}}" -n "$NAMESPACE"
            # `set image` only patches the Deployment; it returns 0 long before any pod pulls the
            # image. Without this wait, a cluster that cannot pull the tag leaves the new pods in
            # ImagePullBackOff while the old ReplicaSet keeps serving - so the release looks GREEN,
            # no failure email is sent, and prod silently never advances. Waiting for convergence
            # turns that into a red build. Matters most on the first pull from a new repository.
            kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=10m

      - name: Send Email on Rollout Kanvas Release Failure
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v6
        env:
          msg: ${{ env.reason != '' && env.reason || ' Rollout Kanvas Failure' }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: GitHub Actions - Rollout Kanvas Release Failure for ${{ env.MESHERY_EXTENSION_VERSION }}
          from: |
            "Meshery Extensions" <no-reply@meshery.io>
          to: |
            "Layer5 Support" <support@layer5.io>
          html_body: |
            <b>REPO:</b> ${{ github.repository }}<br />
            <b>WORKFLOW:</b> ${{ github.workflow }}<br />
            <b>JOB:</b> ${{ github.job }}<br />
            <b>REASON:</b> ${{ env.msg }}<br />
            <b>DETAILS:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">{{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a><br />

  build-and-release-docker-extension:
    needs:
      - build-and-release
    runs-on: ubuntu-24.04
    steps:
      - name: Print Extension Version
        run: |
          echo "Extension Version: ${{ needs.build-and-release.outputs.meshery_extension_version }}"
      - name: Trigger Remote Workflow
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: layer5io
          repo: kanvas-docker-extension
          github_token: ${{ secrets.GH_ACCESS_TOKEN}}
          workflow_file_name: multi-platform.yml
          ref: master
          wait_interval: 10
          client_payload: |
            {
              "release-channel": "stable",
              "release-ver": "${{ needs.build-and-release.outputs.meshery_extension_version }}"
            }
          trigger_workflow: true
          wait_workflow: false  


    # Alternative #1
    # Runs workflow locally, causing storage overflow
    # name: Dispatch (call) Extension Release
    # uses: layer5io/kanvas-docker-extension/.github/workflows/multi-platform.yml@master
    # secrets: inherit
    # with:
    #   release-channel: "stable"
    #   release-ver: ${{ needs.build-and-release.outputs.meshery_extension_version }}


