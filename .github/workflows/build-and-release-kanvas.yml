name: Build and Release Extensions
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of Meshery (e.g. v0.0.0)"
        required: false
      revision:
        description: "Revision of Extension (e.g. 1)"
        required: false
      branch:
        description: Branch of `meshery-extensions` repository to deploy.
        required: false
        default: master

jobs:
  release-kanvas:
    name: Build and Release Extensions
    runs-on: "ubuntu-24.04"
    permissions:
      contents: write
    env:
      MESHERY_EXTENSIONS_PATH: ${{ github.workspace }}/meshery-extensions
      EXTENSION_BUILD_ROOT: /home/runner/.meshery/provider/Layer5
    outputs:
      revision: ${{ steps.fetch-versions.outputs.REVISION }}
      meshery_version: ${{ steps.server-go.outputs.meshery_version }}
    steps:
      - name: Checkout meshery-extensions
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          path: "meshery-extensions"
          fetch-depth: 1
          ref: ${{ inputs.branch }}

      - name: Get latest version for meshery and meshery-extensions
        id: fetch-versions
        working-directory: "meshery-extensions"
        run: |
          export $(make -f Makefile meshery_version)
          export $(make -f Makefile extension_version)
          export $(make -f Makefile extension_revision)

          echo "MESHERY_VERSION=$MESHERY_VERSION" >> $GITHUB_ENV
          echo "EXTENSION_VERSION=$EXTENSION_VERSION" >> $GITHUB_ENV
          echo "EXTENSION_REVISION=$EXTENSION_REVISION" >> $GITHUB_ENV
          echo "LATEST_EXTENSION_VERSION=$MESHERY_VERSION-$EXTENSION_REVISION" >> $GITHUB_ENV

          echo "REVISION=$EXTENSION_REVISION" >> $GITHUB_OUTPUT

          echo "MESHERY_VERSION=$MESHERY_VERSION"
          echo "EXTENSION_VERSION=$EXTENSION_VERSION"
          echo "EXTENSION_REVISION=$EXTENSION_REVISION"
          echo "LATEST_EXTENSION_VERSION=$MESHERY_VERSION-$EXTENSION_REVISION"
          echo "REVISION=$EXTENSION_REVISION"
      - name: Override version and revision, if provided
        if: ${{ inputs.version }}
        run: |
          echo Using manually dispatch values of ${{ inputs.version }} and ${{ inputs.revision }}
          echo "MESHERY_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          echo "EXTENSION_VERSION=$EXTENSION_VERSION" >> $GITHUB_ENV
          echo "EXTENSION_REVISION=${{ inputs.revision }}" >> $GITHUB_ENV
          echo "LATEST_EXTENSION_VERSION=${{ inputs.version }}-${{ inputs.revision }}" >> $GITHUB_ENV
      
      - name: Re-checkout meshery-extensions at release tag
        if: ${{ inputs.version }}
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          path: "meshery-extensions"
          fetch-depth: 1
          ref: ${{ env.LATEST_EXTENSION_VERSION }}

      - name: Checkout meshery/meshery
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: "meshery"
          repository: meshery/meshery
          ref: ${{ env.MESHERY_VERSION }}
          
      # The GraphQL plugin is loaded into the Meshery server with plugin.Open, which
      # requires both to be built with exactly the same Go toolchain. A plugin built
      # with a different one aborts the server with "fatal error: runtime: no plugin
      # module data" on the first extension load. The version comes from the server's
      # own Dockerfile (read by the meshery-extensions Makefile), never restated here.
      - name: Resolve the Meshery server's Go version
        id: server-go
        working-directory: ./meshery-extensions
        run: |
          GO_VERSION="$(make -s meshery-server-go-version)"
          if [ -z "$GO_VERSION" ]; then
            echo "::error::Could not read the Meshery server's Go version from meshery/install/docker/Dockerfile"
            exit 1
          fi
          echo "Meshery server Go version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "meshery_version=$MESHERY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go ${{ steps.server-go.outputs.version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.server-go.outputs.version }}
          cache: false
      
      - name: Verify go.mod compatibility
        id: verify-gomod
        working-directory: ./meshery-extensions
        run: make graphql-sync-err
        continue-on-error: true

      - name: Sync go.mod with Meshery, if diverged
        if: ${{ steps.verify-gomod.outcome == 'failure' }}
        working-directory: ./meshery-extensions
        run: make graphql-sync

      - name: Commit synced go.mod
        id: commit-gomod
        if: ${{ steps.verify-gomod.outcome == 'failure' }}
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: meshery-extensions
          file_pattern: graphql/go.mod graphql/go.sum
          commit_user_name: l5io
          commit_user_email: ci@layer5.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: '--signoff'
          commit_message: 'chore: sync go.mod with Meshery ${{ env.MESHERY_VERSION }}'

      - name: Warn if synced go.mod could not be pushed
        if: ${{ steps.verify-gomod.outcome == 'failure' && steps.commit-gomod.outcome == 'failure' }}
        run: echo "::warning::Could not push synced go.mod back to layer5labs/meshery-extensions@${{ inputs.branch }} (branch protection or network?). Continuing this build with the local fix, but the drift will resurface on the next run until this is pushed manually."

      - name: Re-verify go.mod compatibility after sync
        if: ${{ steps.verify-gomod.outcome == 'failure' }}
        working-directory: ./meshery-extensions
        run: |
          echo "reason='go.mod for Meshery ${{env.MESHERY_VERSION }} and extension ${{ env.LATEST_EXTENSION_VERSION }} has diverged'" >> $GITHUB_ENV;
          make graphql-sync-err
          if [ $? -ne 0 ]; then
            exit 1;
          fi
          # reset the reason otherwise
          echo "reason=" >> $GITHUB_ENV;
          
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify extension compatibility with meshery ui
        id: verify-compat
        if: ${{ !failure() }}
        working-directory: "meshery-extensions"
        run: make kanvas-validate-mesheryui-compatibility
        continue-on-error: true

      - name: Sync UI dependencies with Meshery, if incompatible
        if: ${{ steps.verify-compat.outcome == 'failure' }}
        working-directory: "meshery-extensions"
        run: make sync-ui-deps

      - name: Warn if Meshery UI's remote-component.config.js also needed patching
        if: ${{ steps.verify-compat.outcome == 'failure' }}
        working-directory: "meshery"
        run: |
          if ! git diff --quiet -- ui/remote-component.config.js; then
            echo "::warning::sync-ui-deps patched meshery/ui/remote-component.config.js to expose a package the extension externalizes. This change is local to this run only (we don't have push rights on meshery/meshery) -- a human needs to open a PR there with the same fix, or it will keep recurring."
          fi

      - name: Commit synced UI dependencies
        id: commit-ui-deps
        if: ${{ steps.verify-compat.outcome == 'failure' }}
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: meshery-extensions
          file_pattern: ui/package.json ui/package-lock.json
          commit_user_name: l5io
          commit_user_email: ci@layer5.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: '--signoff'
          commit_message: 'chore: sync UI dependencies with Meshery ${{ env.MESHERY_VERSION }}'

      - name: Warn if synced UI dependencies could not be pushed
        if: ${{ steps.verify-compat.outcome == 'failure' && steps.commit-ui-deps.outcome == 'failure' }}
        run: echo "::warning::Could not push synced UI dependencies back to layer5labs/meshery-extensions@${{ inputs.branch }} (branch protection or network?). Continuing this build with the local fix, but the drift will resurface on the next run until this is pushed manually."

      - name: Re-verify extension compatibility with meshery ui after sync
        if: ${{ steps.verify-compat.outcome == 'failure' }}
        working-directory: "meshery-extensions"
        run: |
          make kanvas-validate-mesheryui-compatibility || {
            message="extension ${{ env.LATEST_EXTENSION_VERSION }} is not compatible with Meshery UI ${{ env.MESHERY_VERSION }}"
            echo "reason=$message" >> $GITHUB_ENV
            echo "$message"
            exit 1
          }
      - name: Build extension
        working-directory: ./meshery-extensions
        run: |
          export PROVIDER_PATH="provider/navigator";
          make prod;
      - name: Generate Artifact
        working-directory: ${{ env.EXTENSION_BUILD_ROOT }}/${{ env.EXTENSION_VERSION }}
        run: |
          pwd;
          ls;
          tar -zcf ${{ env.MESHERY_EXTENSIONS_PATH }}/provider-meshery.tar.gz ./provider;
          tree ${{ env.MESHERY_EXTENSIONS_PATH }};
      - name: debug
        working-directory: ./meshery-extensions
        run: |
          ls;
          pwd;
          echo "${{ github.workspace }}"
          ls .
      - name: Get Meshery Extensions Release draft
        env:
          ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          curl -sL -H "Authorization: token $ACCESS_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/layer5labs/meshery-extensions/releases?per_page=100" > l5_releases.json
          jq -r 'map(select(.draft)) | first | .body' l5_releases.json > releases.md
          DRAFT_ID=$(jq -r 'map(select(.draft)) | first | .id // empty' l5_releases.json)
          DRAFT_UPDATED=$(jq -r 'map(select(.draft)) | first | .updated_at // empty' l5_releases.json)
          LAST_PUB=$(jq -r 'map(select(.draft|not)) | first | .published_at // empty' l5_releases.json)
          # Guard: a draft not refreshed since the last release is a stale leftover, not the live draft.
          if [ -n "$DRAFT_ID" ] && [[ "$DRAFT_UPDATED" > "$LAST_PUB" ]]; then
            echo "DRAFT_ID=$DRAFT_ID" >> "$GITHUB_ENV"
            echo "Using Release Drafter draft $DRAFT_ID (updated $DRAFT_UPDATED)"
          else
            echo "::warning::No current Release Drafter draft (id='$DRAFT_ID', updated '$DRAFT_UPDATED', last release '$LAST_PUB'); not promoting a draft."
          fi
      - name: Release Draft Notes
        uses: actions/github-script@v8
        id: release-draft
        with:
          script: |
              const fs = require('fs')
              const ReleaseDraft = String(fs.readFileSync('./releases.md'))
  
              return ReleaseDraft
          result-encoding: string
      - name: publish stable release on meshery-extensions-packages from tag
        uses: ncipollo/release-action@v1
        with:
          repo: meshery-extensions-packages
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          tag: ${{ env.LATEST_EXTENSION_VERSION }}
          name: Meshery Extensions ${{ env.LATEST_EXTENSION_VERSION }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ${{ env.MESHERY_EXTENSIONS_PATH }}/provider-meshery.tar.gz
          omitNameDuringUpdate: true
          replacesArtifacts: true
          body: |
            ${{ steps.release-draft.outputs.result }}
      - name: Publish Release Drafter draft on layer5labs/meshery-extensions
        if: ${{ env.DRAFT_ID != '' }}
        continue-on-error: true   # worst case falls back to today's behavior (next step creates the release)
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          REPO: layer5labs/meshery-extensions
          TAG: ${{ env.LATEST_EXTENSION_VERSION }}
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null); then
            echo "Release $TAG already published on $REPO (id $existing); not touching draft $DRAFT_ID."
            exit 0
          fi
          if [ "$(gh api "repos/$REPO/releases/$DRAFT_ID" --jq '.draft')" != "true" ]; then
            echo "::warning::Release $DRAFT_ID is no longer a draft; skipping."
            exit 0
          fi
          gh api -X PATCH "repos/$REPO/releases/$DRAFT_ID" \
            -f tag_name="$TAG" \
            -f target_commitish=master \
            -f name="Meshery Extensions $TAG" \
            -F body=@releases.md \
            -F draft=false \
            -f make_latest=legacy \
            --jq '"Published \(.tag_name) from draft \(.id): \(.html_url)"'
      - name: publish stable release on meshery-extensions from tag
        uses: ncipollo/release-action@v1
        with:
          # Extension source lives at layer5labs/meshery-extensions (see workflow header
          # comment). 'owner' defaults to the current repo's owner (meshery-extensions),
          # so it MUST be set explicitly here or the action targets
          # meshery-extensions/meshery-extensions and 404s on list releases.
          owner: layer5labs
          repo: meshery-extensions
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          tag: ${{ env.LATEST_EXTENSION_VERSION }}
          name: Meshery Extensions ${{ env.LATEST_EXTENSION_VERSION }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ${{ env.MESHERY_EXTENSIONS_PATH }}/provider-meshery.tar.gz
          omitNameDuringUpdate: true
          replacesArtifacts: true
          body: |
            ${{ steps.release-draft.outputs.result }}

      - name: Send Email on Extensions Release Failure
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v17
        env:
          msg: ${{ env.reason != '' && env.reason || ' Workflow Build Failure' }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: GitHub Actions - Extensions Release Failure
          from: |
            "Meshery Extensions" <no-reply@meshery.io>
          to: |
            "Layer5 Support" <support@layer5.io>
          html_body: |
            <b>REPO:</b> ${{ github.repository }}<br />  
            <b>WORKFLOW:</b> ${{ github.workflow }}<br />
            <b>JOB:</b> ${{ github.job }}<br />
            <b>REASON:</b> ${{ env.msg }}<br />
            <b>DETAILS:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.status }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a><br />
  
  # kanvas-production-test-release:
  #   needs: release-kanvas
  #   uses: ./.github/workflows/production-smoke-test-reusable.yml
  #   secrets: inherit
  #   with:
  #     project: "kanvas"

  rollout-kanvas:
    needs: release-kanvas
    name: Build and Rollout Extensions
    # The extension package is bundled into the Kanvas image (kanvas.new runs with
    # SKIP_DOWNLOAD_EXTENSIONS=true), so every extension release, including a new
    # revision on the same Meshery version, needs a new image to reach kanvas.new.
    # The server is built from the same Meshery version the plugin was built against.
    secrets: inherit
    uses: ./.github/workflows/build-and-deploy-meshery-extensions-playground-reusable.yml
    with:
      branch: ${{ needs.release-kanvas.outputs.meshery_version }}
