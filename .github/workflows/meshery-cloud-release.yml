name: Release and Deploy Meshery Cloud
on:
  workflow_call:
    inputs:
      release-environment: 
        description: "Staging or Production (lowercase)"
        required: true
        default: "staging"
        type: string
      release-version:
        description: "e.g. v0.8.312"
        required: true
        default: "latest"
        type: string
      branch:
        description: "Branch to deploy in the staging environment. If not provided, master branch of the repository will be used."
        default: "master"
        type: string
    secrets:
      GLOBAL_TOKEN:
        required: true
      GH_ACCESS_TOKEN: 
        required: true
      DOCKER_USERNAME: 
        required: true
      DOCKER_PASSWORD: 
        required: true
      OCI_BASTION_HOST:
        required: true
      OCI_BASTION_USERNAME:
        required: true
      OCI_BASTION_KEY:
        required: true
      MAIL_USERNAME:
        required: true
      MAIL_PASSWORD:
        required: true

  workflow_dispatch:
    inputs:
      release-environment: 
        description: "Staging or Production (lowercase)"
        required: true
        default: "production"
      release-version: 
        description: "e.g. v0.8.312 or 'latest'"
        required: true
        default: "v0.8.3"
      branch:
        description: "Branch to deploy in the staging environment. If not provided, master branch of the repository will be used."
        default: "master"
        type: string

env:
  GIT_VERSION: ${{inputs.release-version}}

jobs:
  lint-fix:
    name: Lint UI and Backend
    if: inputs.release-environment == 'staging'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Meshery Cloud code
        uses: actions/checkout@v7
        with:
          path: meshery-cloud
          repository: layer5io/meshery-cloud
          fetch-depth: 1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          ref: ${{ inputs.branch }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Install prettier and eslint
        run: |
           npm i -g prettier;
           npm i -g eslint;
      - name: Lint UI and Backend
        run: |
          cd meshery-cloud
          make ui-lint-fix
          make cloud-lint-fix
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          commit_user_email: l5io@layer5.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: '--signoff'
          commit_message: '[CI] Lint fix backend/ui'
          repository: meshery-cloud

  staging:
    if: inputs.release-environment == 'staging'
    name: Staging - Docker build and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️ repo
        uses: actions/checkout@v7
        with:
          path: meshery-cloud
          repository: layer5io/meshery-cloud
          fetch-depth: 1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          ref: ${{ inputs.branch }}
      - name: Identify Release Values
        working-directory: meshery-cloud
        run: |
          set -euo pipefail

          latest_version="$(git ls-remote --refs --sort='v:refname' --tags origin 'v*' | tail -1 | cut -f2 | sed 's#refs/tags/##')"
          if [[ -z "${latest_version}" ]]; then
            echo "Failed to determine the latest release tag from origin." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_channel="stable"
          else
            release_channel="edge"
          fi

          git_version="${latest_version}"
          git_stripped_version="${git_version#v}"

          {
            echo "RELEASE_CHANNEL=${release_channel}"
            echo "GIT_LATEST=${latest_version}"
            echo "GIT_VERSION=${git_version}"
            echo "GIT_STRIPPED_VERSION=${git_stripped_version}"
            echo "GIT_COMMITSHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

          echo "Release channel determined to be ${release_channel}"
          echo "Resolved release values: latest=${latest_version}, version=${git_version}, stripped=${git_stripped_version}"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: layer5/meshery-cloud
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{inputs.release-environment}}-{{sha}}
            type=semver,pattern={{version}},value=${{env.GIT_STRIPPED_VERSION}}
            type=raw,value=${{inputs.release-environment}}-{{tag}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{inputs.release-environment}}-latest
            type=raw,value=${{inputs.release-environment}}-${{env.GIT_VERSION}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: meshery-cloud
          push: true
          build-args: |
            ENVIRONMENT="stg"
            GIT_VERSION=${{inputs.release-environment}}-${{inputs.release-version}}
            GIT_COMMITSHA=${{ env.GIT_COMMITSHA }}
            RELEASE_CHANNEL=${{inputs.release-environment}}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
      - name: Deploy staging on OCI OKE
        uses: appleboy/ssh-action@master
        env:
            GIT_VERSION: ${{inputs.release-version}}
        with:
          host: ${{ secrets.OCI_BASTION_HOST }}
          username: ${{ secrets.OCI_BASTION_USERNAME }}
          key: ${{ secrets.OCI_BASTION_KEY }}
          port: 22
          envs: GIT_VERSION
          script: |
            kubectl config use-context staging
            helm upgrade --install -f ~/deploy/meshery-cloud/install/environment/staging/values.yaml cloud ~/deploy/meshery-cloud/install/kubernetes/helm/layer5-cloud/ -n staging --set=image.tag=$GIT_VERSION --set-file env.githubAppPrivateKey=./deploy/meshery-cloud/install/environment/staging/github/layer5-cloud-staging.pem --set-file 'kratos.kratos.emailTemplates.recovery.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-recover-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.recovery.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-recover.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-verify-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-verify.body.gotmpl
  prod:
    if: inputs.release-environment == 'production'
    name: Production - Docker build and push
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Meshery Cloud code
      uses: actions/checkout@v7
      with:
        repository: layer5io/meshery-cloud
        path: meshery-cloud
        fetch-depth: 1
        token: ${{ secrets.GH_ACCESS_TOKEN }}
        # Allow deploying from a configurable branch/tag (defaults to master) instead of the release version tag,
        # which may not exist yet when this workflow runs.
        ref: ${{ inputs.branch }}

    - name: Capture Cloud commit SHA
      working-directory: meshery-cloud
      run: echo "GIT_COMMITSHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    # Reclaim disk on the hosted runner before the multi-stage image build.
    # The prod image bundles a Go server, a Node/Next.js UI build, and academy
    # content; without this the "Build and Push" step intermittently fails with
    # "No space left on device" on the ~21 GB ubuntu-24.04 root filesystem.
    #
    # Note: the UI is compiled inside the Dockerfile's `node` stage (which runs
    # its own `make ui-setup && make ui-build`), and `.dockerignore` excludes
    # node_modules from the build context - so a host-side `make ui-setup` step
    # here built nothing that reached the image and only consumed runner disk.
    - name: Free up runner disk space
      run: |
        echo "Disk space before cleanup:"; df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/graalvm 2>/dev/null || true
        echo "Disk space after cleanup:"; df -h /
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Docker Meta
      id: meta
      uses: docker/metadata-action@v6
      with:
          images: layer5/meshery-cloud
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{inputs.release-environment}}-{{sha}}
            type=raw,value=${{inputs.release-environment}}-{{tag}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{inputs.release-environment}}-latest
            type=raw,value=${{inputs.release-environment}}-${{inputs.release-version}}
            type=raw,value=${{inputs.release-environment}}-${{env.GIT_VERSION}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}        
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and Push
      uses: docker/build-push-action@v7
      with:
        context: meshery-cloud
        push: true
        build-args: |
          ENVIRONMENT=prod
          GIT_VERSION=${{inputs.release-environment}}-${{inputs.release-version}}
          GIT_COMMITSHA=${{ env.GIT_COMMITSHA }}
          RELEASE_CHANNEL=${{inputs.release-environment}}
          TOKEN=${{ secrets.GLOBAL_TOKEN }}
        tags: ${{ steps.meta.outputs.tags }}
        platforms: linux/amd64
    - name: Deploy production on bastion host
      uses: appleboy/ssh-action@master
      env:
          GIT_VERSION: ${{inputs.release-environment}}-${{inputs.release-version}}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      with:
        host: ${{ secrets.OCI_BASTION_HOST }}
        username: ${{ secrets.OCI_BASTION_USERNAME }}
        key: ${{ secrets.OCI_BASTION_KEY }}
        port: 22
        envs: 
            GIT_VERSION, GH_ACCESS_TOKEN
        # It is important to use bash, specifically so that git works
        # and can use the GH_ACCESS_TOKEN env var properly
        script: |
          bash
          set -e
          helm repo update layer5
          cd deploy/meshery-cloud && git pull https://l5io:$GH_ACCESS_TOKEN@github.com/layer5io/meshery-cloud.git master
          cd ../..
          kubectl config use-context prod
          helm upgrade --install -f ~/deploy/meshery-cloud/install/environment/production/values.yaml cloud ~/deploy/meshery-cloud/install/kubernetes/helm/layer5-cloud/ -n cloud --set=image.tag=$GIT_VERSION --set-file env.githubAppPrivateKey=./deploy/meshery-cloud/install/environment/production/github/production.pem --set-file 'kratos.kratos.emailTemplates.recovery.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-recover-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.recovery.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-recover.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-verify-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-verify.body.gotmpl

    - name: Send Email on Cloud Release Failure
      if: ${{ failure() }}
      uses: dawidd6/action-send-mail@v6
      env:
        msg: ${{ env.reason != '' && env.reason || ' Workflow Build Failure' }}
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "[GitHub Actions] Layer5 Cloud Release Failure: ${{inputs.release-environment}} ${{inputs.release-version}}"
        from: |
          "Layer5 Cloud" <no-reply@layer5.io>
        to: |
          "Layer5 Support" <support@layer5.io>
        html_body: |
          <b>REPO:</b> ${{ github.repository }}<br />  
          <b>WORKFLOW:</b> ${{ github.workflow }}<br />
          <b>JOB:</b> ${{ github.job }}<br />
          <b>REASON:</b> ${{ env.msg }}<br />
          <b>DETAILS:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.status }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a><br />
